[package]
name = "desk-panel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# Test-only synthetic backend (fake PCs, pairing codes and an H.264 sample stream).
# Never part of a shipped build; see src/backend/demo.rs.
demo = []

[dependencies]
desk-config = { workspace = true }
desk-crypto = { workspace = true }
desk-error = { workspace = true }
desk-i18n = { workspace = true }
desk-logger = { workspace = true }
desk-paths = { workspace = true }
desk-protocol = { workspace = true }
desk-service-core = { workspace = true }
desk-session-helper = { path = "../desk-session-helper", version = "0.1.0" }
desk-theme = { workspace = true }
desk-transfer = { workspace = true }
desk-transport = { workspace = true }
desk-update = { workspace = true }
desk-version = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = { workspace = true }
