[package]
name = "desk-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "DeskRemote-Ajan"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
desk-error = { workspace = true }
desk-paths = { workspace = true }
desk-logger = { workspace = true }
desk-service-core = { workspace = true }
desk-session-helper = { path = "../desk-session-helper", version = "0.1.1" }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }

[build-dependencies]
desk-exe-identity = { workspace = true, features = ["embed"] }
