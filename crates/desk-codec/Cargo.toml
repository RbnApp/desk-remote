[package]
name = "desk-codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Software H.264 fallback (Cisco OpenH264, built from source; install `nasm` for usable speed).
software-fallback = ["dep:openh264"]

[dependencies]
desk-error = { workspace = true }
desk-capture = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
openh264 = { version = "0.9", optional = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[dev-dependencies]
desk-logger = { workspace = true }
